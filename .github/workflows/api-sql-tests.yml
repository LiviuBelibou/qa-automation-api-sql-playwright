name: API and SQL Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: api-sql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-checks:
    name: API and SQL quality checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Prepare local test settings
        run: cp .env.example .env

      - name: Install dependencies
        run: npm ci

      - name: Start PostgreSQL and initialize tables
        run: npm run db:up

      - name: Run quality checks and tests
        run: npm run check

      - name: Show database logs on failure
        if: failure()
        run: docker compose logs --no-color db

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: api-sql-test-results
          path: |
            playwright-report/
            test-results/
          retention-days: 14
          if-no-files-found: ignore

      - name: Stop the CI database
        if: always()
        run: docker compose down --volumes
